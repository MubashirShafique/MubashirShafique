<svg width="850" height="220" viewBox="0 0 850 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="850" height="220" fill="#0d1117"/>

  <text x="40" y="65" font-family="'Courier New', monospace" font-size="32" font-weight="bold" filter="url(#glow)" fill="#00FFFF" opacity="0">
    Hey, I'm Muhammad Mubashir Shafique
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
  </text>

  <text x="150" y="120" font-family="'Courier New', monospace" font-size="28" font-weight="bold" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.1s" fill="freeze"/>
    <tspan fill="#FF00E0">AI</tspan><tspan fill="#ffffff"> / </tspan><tspan fill="#00FF85">Machine</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#FFD000">Learning</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#00AAFF">Engineer</tspan>
  </text>

  <text x="100" y="175" font-family="'Courier New', monospace" font-size="26" font-weight="bold" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.1s" fill="freeze"/>
    <tspan fill="#FF6B00">Building</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#00FFFF">AI Agents</tspan><tspan fill="#ffffff"> &amp; </tspan><tspan fill="#A864FF">Deep Learning Systems</tspan>
  </text>
</svg>
